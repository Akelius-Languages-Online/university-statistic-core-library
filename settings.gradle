pluginManagement {
    repositories {
        maven {
            url 'https://pkgs.dev.azure.com/akeliuseducation/_packaging/akeliuseducation/maven/v1'
            name 'akeliuseducation'
            credentials {
                username = 'akeliuseducation'
                password = System.getenv("AZURE_ARTIFACTS_PASSWORD")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
rootProject.name = 'university-statistic-core-library'
