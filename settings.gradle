pluginManagement {
    repositories {
        maven {
            url = uri("https://pkgs.dev.azure.com/akeliuseducation/_packaging/akeliuseducation/maven/v1")
            credentials {
                username = System.getProperty("akeliuseducationUsername") ?: System.getenv("ORG_GRADLE_PROJECT_akeliuseducationUsername") ?: "akeliuseducation"
                password = System.getProperty("akeliuseducationPassword") ?: System.getenv("ORG_GRADLE_PROJECT_akeliuseducationPassword") ?: System.getenv("AZURE_ARTIFACTS_PASSWORD")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
rootProject.name = 'university-statistic-core-library'
